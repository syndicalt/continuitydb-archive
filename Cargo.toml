[workspace]
resolver = "2"
members = [
    "crates/continuitydb-core",
    "crates/continuitydb-kernel",
    "crates/continuitydb-memory",
    "crates/continuitydb-revision",
    "crates/continuitydb-checkout",
    "crates/continuitydb-query",
    "crates/continuitydb-api",
    "crates/continuitydb-cli",
    "crates/continuitydb-steward",
    "crates/continuitydb-workload",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cheapseatsecon/continuitydb"
rust-version = "1.78"
description = "Rust-native embeddable datastore for agent world models"
readme = "README.md"
keywords = ["agents", "database", "embeddable", "memory", "retrieval"]
categories = ["database-implementations"]

[workspace.dependencies]
assert_cmd = "2.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
ureq = { version = "3.3", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
