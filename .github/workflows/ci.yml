name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Alpha Workflow
        run: bash examples/alpha_workflow.sh target/alpha-workflow

      - name: Upload Alpha Workflow Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuitydb-alpha-workflow
          path: target/alpha-workflow
          if-no-files-found: warn

      - name: Local Model Quality Gate Smoke
        run: bash examples/local_model_quality_gate_smoke.sh target/local-model-quality-gate-smoke

      - name: Upload Local Model Quality Gate Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuitydb-local-model-quality-gate-smoke
          path: target/local-model-quality-gate-smoke
          if-no-files-found: warn

      - name: Release Preflight
        run: scripts/release_preflight.sh

      - name: Test Release Upload Script
        run: scripts/test_upload_release_assets.sh

      - name: Test Release Workflow Contract
        run: scripts/test_release_workflow_contract.sh

      - name: CI Artifact Inventory
        run: scripts/ci_artifact_inventory.sh

      - name: Validate CI Artifact Inventory
        run: scripts/validate_ci_artifact_inventory.sh

      - name: Upload CI Artifact Inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuitydb-ci-artifact-inventory
          path: |
            target/ci-artifact-inventory.json
            target/ci-artifact-inventory-failure.json
            target/ci-artifact-inventory-validation.json
            target/ci-artifact-inventory-validation-failure.json
          if-no-files-found: warn

      - name: Upload Release Preflight Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuitydb-release-preflight
          path: target/release-preflight
          if-no-files-found: warn

      - name: Diff Check
        run: git diff --check
